name: "Supabase Deploy"

on:
  push:
    paths:
      - 'web/supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout web repository (explicit)
        uses: actions/checkout@v4
        with:
          repository: 'Kyungoh-Kim/SanDeVentura-web'
          path: web
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install supabase CLI
        run: npm install -g supabase@latest

      - name: Install Deno
        run: curl -fsSL https://deno.land/x/install/install.sh | sh

      - name: Add Deno to PATH
        run: echo "${HOME}/.deno/bin" >> $GITHUB_PATH

      - name: Login to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link project
        working-directory: web/supabase
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply DB migrations
        working-directory: web/supabase
        run: |
          # Apply migrations (ensure migrations are present in web/supabase/migrations)
          # Use --linked to push to the linked project created above
          supabase db push --linked --yes

      - name: Deploy Edge Functions
        working-directory: web/supabase
        run: |
          # Deploy all functions for the linked project
          supabase functions deploy --all
