name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install supabase CLI
        run: npm install -g supabase@latest

      - name: Install Deno
        run: curl -fsSL https://deno.land/x/install/install.sh | sh

      - name: Add Deno to PATH
        run: echo "${HOME}/.deno/bin" >> $GITHUB_PATH

      - name: Install GitHub CLI (gh)
        run: |
          sudo apt-get update
          sudo apt-get install -y gh || true

      - name: Verify installed tools
        run: |
          supabase --version || true
          node --version
          deno --version || true
          gh --version || true

      - name: Reminder: configure Copilot environment secrets
        run: |
          echo "Add sensitive credentials (SUPABASE_ACCESS_TOKEN, SUPABASE_SERVICE_ROLE_KEY) to the 'copilot' environment or GitHub Secrets. Do NOT commit secrets to the repo."
